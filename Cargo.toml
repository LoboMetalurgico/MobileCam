[package]
name = "mobile-cam"
version = "0.1.0"
edition = "2024"

[build-dependencies]
phf_codegen = "0.13.1"
prost-build = "0.14.3"
walkdir = "2.5.0"

[dependencies]
actix-files = "0.6.10"
actix-web = { version = "4.13.0", features = ["rustls-0_23"] }
actix-ws = "0.4.0"
if-addrs = "0.15.0"
derive_more = { version = "2.1.1", features = ["into", "from_str"] }
mime = "0.3.17"
mime_guess = "2.0.5"
parking_lot = "0.12.5"
phf = { version = "0.13.1", default-features = false }
prost = "0.14.3"
prost-types = "0.14.3"
rustls = "0.23.38"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.51.1", features = ["macros", "parking_lot"] }
tracing = "0.1.37"

[dependencies.rcgen]
version = "0.14.7"
default-features = false
features = ["aws_lc_rs"]

[dependencies.tracing-subscriber]
version = "0.3.23"
features = ["env-filter", "smallvec", "parking_lot", "time"]
