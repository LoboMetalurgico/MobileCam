[package]
name = "mobile-cam"
version = "0.1.0"
edition = "2024"

[build-dependencies]
phf_codegen = "0.13.1"
walkdir = "2.5.0"

[dependencies]
actix-web = { version = "4.13.0", features = ["rustls-0_23"] }
actix-ws = "0.4.0"
bytestring = "1.5.0"
dashmap = "6.1.0"
fxhash = "0.2.1"
parking_lot = "0.12.5"
phf = { version = "0.13.1", default-features = false }
rcgen = { version = "0.14.7", default-features = false, features = ["aws_lc_rs"] }
rustls = "0.23.38"
rustls-pki-types = "1.14.0"
tokio = { version = "1.51.1", features = ["macros", "parking_lot"] }